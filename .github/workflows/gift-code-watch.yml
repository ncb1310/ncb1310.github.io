name: Check Kingshot gift codes
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gift-code-watch.yml'
      - 'scripts/watch_gift_codes.py'
permissions:
  contents: write
concurrency:
  group: ncb-gift-code-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Read public code lists
        id: collect
        continue-on-error: true
        run: python scripts/watch_gift_codes.py
      - name: Save candidates and source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gift-codes/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Kingshot gift code check'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.collect.outcome == 'failure'
        run: exit 1
