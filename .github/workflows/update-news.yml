name: Update NCB news
on:
  push:
    branches: [main]
    paths:
      - 'news/**'
      - 'scripts/build_news.py'
      - '.github/workflows/update-news.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_news.py
      - name: Commit generated news
        run: |
          if ! git diff --quiet -- news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "Auto-update NCB news feed"
            git push
          fi
